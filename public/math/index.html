<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>数学家 · 拍照批改 + 举一反三</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
   <div class="topbar-inner">
    <div class="brand" id="brand">数学家</div>
    <nav class="topnav">
      <a href="#/" data-nav="/">作业</a>
      <a href="#/wrong" data-nav="/wrong">错题本</a>
      <a href="#/compose" data-nav="/compose">组卷</a>
      <a href="#/textbook" data-nav="/textbook">大纲</a>
      <a href="#/settings" data-nav="/settings">设置</a>
    </nav>
    <button class="user-chip" id="user-chip" title="切换用户">
      <span class="uc-avatar" id="uc-avatar">🙂</span>
      <span class="uc-name" id="uc-name"></span>
    </button>
   </div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast"></div>
  <div id="mask" class="mask hidden"><div class="mask-box"><div class="spinner"></div><div id="mask-text">处理中…</div></div></div>
</div>

<!-- 切换用户 -->
<div id="user-modal" class="modal hidden">
  <div class="modal-card">
    <h3>切换用户</h3>
    <div class="hint">每个人的作业、错题、变式、卷子、大纲、模型设置都是分开存的，互不影响。</div>
    <div id="user-list" class="user-list"></div>
    <div class="row-end" style="margin-top:12px">
      <button class="btn" id="user-manage">管理用户</button>
      <button class="btn primary" id="user-close">关闭</button>
    </div>
  </div>
</div>


<!-- 口令弹窗 -->
<div id="pass-modal" class="modal hidden">
  <div class="modal-card">
    <h3>请输入家庭口令</h3>
    <p class="muted">这台设备还没有通过验证。</p>
    <input type="password" id="pass-input" placeholder="家庭口令" />
    <div class="row-end"><button class="btn primary" id="pass-ok">进入</button></div>
  </div>
</div>

<!-- 交作业弹窗：先问「这份作业属于哪一课」，再调起拍照 / 相册 -->
<div id="up-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="up-title">交作业</h3>
    <div class="field">
      <label>教材</label>
      <select id="up-tb"></select>
    </div>
    <div class="field">
      <label>这次作业属于</label>
      <select id="up-lesson"></select>
      <div class="hint">选了以后这份作业就挂在对应单元/课文下，以后按单元复习一筛就出来。不选也行，批改完再归类。<br/>作业有几页就传几张：选完会先进一个「凑页」的框，可以接着再拍/再选，攒够了一次性上传批改。</div>
    </div>
    <div class="row-end">
      <button class="btn" id="up-cancel">取消</button>
      <button class="btn primary" id="up-go">开始</button>
    </div>
  </div>
</div>

<!-- 拍照（直接调起摄像头）。多页作业逐张拍，所以这里不设 multiple -->
<input type="file" id="file-homework" accept="image/*" capture="environment" class="hidden" />
<input type="file" id="file-variant" accept="image/*" capture="environment" class="hidden" />
<!-- 从相册选（不带 capture，系统才会弹出「拍照 / 照片图库 / 浏览」选项）。multiple = 一次选多页 -->
<input type="file" id="file-homework-album" accept="image/*" multiple class="hidden" />
<input type="file" id="file-variant-album" accept="image/*" class="hidden" />
<!-- 组卷的答卷（拍做好的卷子交回来） -->
<input type="file" id="file-paper" accept="image/*" capture="environment" class="hidden" />
<input type="file" id="file-paper-album" accept="image/*" class="hidden" />
<!-- 作业详情里编辑图片：换掉某一页 / 再补几页（不带 capture，系统会同时给「拍照」和「照片图库」） -->
<input type="file" id="file-page-replace" accept="image/*" class="hidden" />
<input type="file" id="file-page-add" accept="image/*" multiple class="hidden" />

<script type="module" src="js/app.js"></script>
<!-- 三个小应用互跳的切换组件（挂在左上角「数学家」上；脚本自带样式，加载失败也不影响原标题） -->
<script src="/app/app-switch.js" data-app="math" data-mount=".brand"></script>
</body>
</html>
