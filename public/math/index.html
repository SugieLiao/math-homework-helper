<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>数学家 · 拍照批改 + 举一反三</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" id="brand">数学家</div>
    <nav class="topnav">
      <a href="#/" data-nav="/">作业</a>
      <a href="#/wrong" data-nav="/wrong">错题本</a>
      <a href="#/textbook" data-nav="/textbook">大纲</a>
      <a href="#/settings" data-nav="/settings">设置</a>
    </nav>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast"></div>
  <div id="mask" class="mask hidden"><div class="mask-box"><div class="spinner"></div><div id="mask-text">处理中…</div></div></div>
</div>

<!-- 口令弹窗 -->
<div id="pass-modal" class="modal hidden">
  <div class="modal-card">
    <h3>请输入家庭口令</h3>
    <p class="muted">这台设备还没有通过验证。</p>
    <input type="password" id="pass-input" placeholder="家庭口令" />
    <div class="row-end"><button class="btn primary" id="pass-ok">进入</button></div>
  </div>
</div>

<!-- 交作业弹窗：先问「这份作业属于哪一课」，再调起拍照 / 相册 -->
<div id="up-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="up-title">交作业</h3>
    <div class="field">
      <label>教材</label>
      <select id="up-tb"></select>
    </div>
    <div class="field">
      <label>这次作业属于</label>
      <select id="up-lesson"></select>
      <div class="hint">选了以后这份作业就挂在对应单元/课文下，以后按单元复习一筛就出来。不选也行，批改完再归类。</div>
    </div>
    <div class="row-end">
      <button class="btn" id="up-cancel">取消</button>
      <button class="btn primary" id="up-go">开始</button>
    </div>
  </div>
</div>

<!-- 拍照（直接调起摄像头） -->
<input type="file" id="file-homework" accept="image/*" capture="environment" class="hidden" />
<input type="file" id="file-variant" accept="image/*" capture="environment" class="hidden" />
<!-- 从相册选（不带 capture，系统才会弹出「拍照 / 照片图库 / 浏览」选项） -->
<input type="file" id="file-homework-album" accept="image/*" class="hidden" />
<input type="file" id="file-variant-album" accept="image/*" class="hidden" />
<!-- 组卷的答卷（拍做好的卷子交回来） -->
<input type="file" id="file-paper" accept="image/*" capture="environment" class="hidden" />
<input type="file" id="file-paper-album" accept="image/*" class="hidden" />

<script type="module" src="js/app.js"></script>
</body>
</html>
